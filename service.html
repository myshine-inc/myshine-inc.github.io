<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式会社 舞進 | 人材育成・組織づくり・経営支援</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="top-page">

<header class="site-header">
<a href="index.html" class="site-logo">
    <img src="images/myshine_logo.png" alt="舞進ロゴ" class="site-logo-mark">
    <img src="images/myshine.png" alt="株式会社 舞進" class="site-logo-main">
</a>

    <nav class="index-nav" aria-label="メインメニュー">
        <a href="service.html" class="index-tab active"> 研 修 </a>
        <a href="company.html" class="index-tab">会社情報</a>
        <a href="contact.html" class="index-tab">Contact</a>
    </nav>
</header>

<section id="service">
    <div class="line"></div>
    <h2>研修内容</h2>
    <div class="line"></div>
    
    <div class="service-vertical-container">
        <div class="service-item">
            <div class="service-text-area"> 
            <h3>ノービス 研修</h3>
            <p>社会人としての基礎マインドと<br>組織で働くためのコミュニケーションスキルを習得します。</p>
            </div>
            <img src="images/novice.png" alt="キャリアデザイン研修" class="service-img-fluid zoomable-image">
        </div>

        <div class="service-item">
            <div class="service-text-area">
            <h3>リーダー 研修</h3>
            <p>チームを率いるためのマネジメント能力と信頼関係を築く対話術を磨きます。</p>
            </div>
            <img src="images/reader.png" alt="マネージャー研修" class="service-img-fluid zoomable-image">
        </div>
    </div>
</section>
    <script>
    // ロゴをクリックしてTOPに戻った場合はアニメーションをスキップ
    if (sessionStorage.getItem("skipIntro") === "true") {
        const intro = document.getElementById("intro-animation");
        if (intro) {
            intro.style.display = "none";
        }
        sessionStorage.removeItem("skipIntro");
    }

    // 左上の舞進ロゴをクリックしたら、次のTOP表示でアニメーションをスキップ
    document.querySelector(".site-logo").addEventListener("click", function () {
        sessionStorage.setItem("skipIntro", "true");
    });
</script>
    <div class="image-lightbox" id="image-lightbox">
    <img src="" alt="">
</div>

<script>
    const zoomImages = document.querySelectorAll(".zoomable-image");
    const lightbox = document.getElementById("image-lightbox");
    const lightboxImage = lightbox.querySelector("img");

    zoomImages.forEach(function (image) {
        image.addEventListener("click", function () {
            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            lightbox.classList.add("show");
        });
    });

    lightbox.addEventListener("click", function () {
        lightbox.classList.remove("show");
        lightboxImage.src = "";
    });
</script>
</body>
</html>
